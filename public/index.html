<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyTrack Leaderboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #20242d; --text: #e8eaf0;
    --muted: #8b93a7; --accent: #ff7a1a; --accent2: #ffb347; --border: #2a2f3a;
    --gold: #f5c542; --silver: #c0c6d0; --bronze: #cd7f32; --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(15,17,21,.95); backdrop-filter: blur(6px);
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; margin-right: auto; }
  header h1 span { color: var(--accent); }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  input[type=text], input[type=password], input:not([type]) {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none; min-width: 0;
  }
  input:focus { border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  button.primary {
    background: var(--accent); color: #111; border: 0; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--accent2); }
  #userInput, #passInput { width: 130px; }
  .field[hidden], form[hidden] { display: none; }
  #authErr { color: var(--danger); font-size: 12px; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  button.ghost:hover { background: var(--border); }
  td.name { text-transform: capitalize; }
  .login-note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  #newMap { width: 140px; }

  .layout {
    display: grid; gap: 16px; padding: 20px 24px; max-width: 1900px; margin: 0 auto;
    grid-template-columns: 300px 1fr; align-items: start;
  }

  .grid {
    display: grid; gap: 16px; min-width: 0;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); align-items: start;
  }
  .card.overall {
    --c1: #f5c542; --c2: #ffe08a;
    --pat: radial-gradient(circle at 90% 50%, rgba(255,220,100,.25) 0 18px, transparent 19px);
  }
  .side {
    display: flex; flex-direction: column; gap: 16px;
    position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto;
  }
  .side .card:hover { transform: none; }
  .side .card { flex-shrink: 0; }
  td.nef { color: var(--muted); font-weight: 600; }
  td.pts { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c2); white-space: nowrap; }
  td.maps { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .overall td.name { max-width: 110px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; padding: 16px 12px; }
    .side { position: static; max-height: none; overflow: visible; }
  }
  .card {
    --c1: #ff7a1a; --c2: #ffb347; --pat: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 9%, var(--panel)), var(--panel) 220px);
    border: 1px solid color-mix(in srgb, var(--c1) 35%, var(--border));
    border-top: 3px solid var(--c1);
    border-radius: 12px; overflow: hidden;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px color-mix(in srgb, var(--c1) 25%, transparent); }
  .banner {
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    background: var(--pat), linear-gradient(135deg, color-mix(in srgb, var(--c1) 40%, transparent), color-mix(in srgb, var(--c2) 8%, transparent));
  }
  .banner h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .banner .ico { font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .banner small { color: var(--muted); font-size: 12px; }
  .body { padding: 6px 16px 14px; }
  .card button.primary { background: var(--c1); }
  .card button.primary:hover { background: var(--c2); }
  .card input:focus { border-color: var(--c1); }
  .card tr.r1 td.time { color: var(--c2); }
  .card td { border-top-color: color-mix(in srgb, var(--c1) 18%, var(--border)); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 6px; border-top: 1px solid var(--border); font-size: 14px; }
  td.rank { width: 28px; font-weight: 700; color: var(--muted); }
  tr.r1 td.rank { color: var(--gold); } tr.r2 td.rank { color: var(--silver); } tr.r3 td.rank { color: var(--bronze); }
  td.name { overflow: hidden; text-overflow: ellipsis; max-width: 120px; white-space: nowrap; }
  td.time { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; text-align: right; white-space: nowrap; }
  td.diff { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  td.act { width: 26px; text-align: right; }
  .del { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 6px; opacity: .4; }
  tr:hover .del { opacity: 1; }
  .del:hover { color: var(--danger); background: var(--panel2); }
  .empty { color: var(--muted); padding: 14px 0; text-align: center; font-size: 13px; }
  .more { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 6px 0 0; width: 100%; }
  .more:hover { color: var(--accent); }
  form.quick { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  form.quick input { flex: 1; }
  .err { color: var(--danger); font-size: 12px; min-height: 0; margin-top: 4px; }
  .err.ok { color: var(--c2); }
  tr.me td.name { color: var(--c2); font-weight: 600; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 24px; max-width: 1900px; margin: 12px auto 0; }
</style>
</head>
<body>
<header>
  <h1>Poly<span>Track</span> Leaderboard</h1>
  <form class="field" id="loginForm">
    <input id="userInput" placeholder="Benutzername" autocomplete="username" maxlength="30">
    <input id="passInput" type="password" placeholder="Passwort" autocomplete="current-password">
    <button class="primary" type="submit">Login</button>
    <span id="authErr"></span>
  </form>
  <div class="field" id="userBox" hidden>
    <span>Eingeloggt als <b id="whoami" style="text-transform:capitalize"></b></span>
    <button class="primary ghost" id="logoutBtn" type="button">Logout</button>
  </div>
  <label class="toggle"><input type="checkbox" id="bestOnly" checked> Beste Zeit pro Person</label>
  <form class="field" id="addMapForm"><input id="newMap" placeholder="Neue Map…" maxlength="60"><button class="primary" type="submit">+</button></form>
</header>
<div class="hint" id="hint"></div>
<div class="layout">
  <aside class="side">
    <section class="card overall" id="overall"></section>
    <div id="bosses" style="display:contents"></div>
  </aside>
  <div class="grid" id="grid"></div>
</div>

<script>
// ====== HIER DEINE SUPABASE-DATEN EINTRAGEN (siehe Anleitung) ======
const SUPABASE_URL = 'https://fsjiffjmjdeevbyibslz.supabase.co'
const SUPABASE_KEY = 'sb_publishable_8oXS2y2qthiPjiMnOkub5Q_Iggu7tTC';
// ====================================================================

const $ = (id) => document.getElementById(id);

// ---------- Login (Supabase Auth) ----------
let session = null;
try { session = JSON.parse(localStorage.getItem('pt-session')); } catch {}

const usernameToEmail = (u) => u.trim().toLowerCase().replace(/\s+/g, '') + '@example.com';

function saveSession(sess) {
  const changed = (session && session.user_id) !== (sess && sess.user_id);
  session = sess;
  try { sess ? localStorage.setItem('pt-session', JSON.stringify(sess)) : localStorage.removeItem('pt-session'); } catch {}
  if (changed) { renderAuth(); render(); }
}
function toSession(j) {
  return {
    access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || Math.floor(Date.now() / 1000) + j.expires_in,
    user_id: j.user.id, username: (j.user.email || '').split('@')[0],
  };
}
async function authCall(grant, body) {
  const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=' + grant, {
    method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('auth');
  return toSession(await res.json());
}
let refreshing = null;
function refreshSession() {
  if (!session) return Promise.reject(new Error('no session'));
  if (!refreshing) {
    refreshing = authCall('refresh_token', { refresh_token: session.refresh_token })
      .then((s) => saveSession(s))
      .catch((e) => { if (e.message === 'auth') saveSession(null); throw e; })
      .finally(() => { refreshing = null; });
  }
  return refreshing;
}
function renderAuth() {
  const on = !!session;
  $('loginForm').hidden = on;
  $('userBox').hidden = !on;
  $('addMapForm').hidden = !on;
  if (on) $('whoami').textContent = session.username;
  $('hint').textContent = on
    ? 'Zeit bei der Map eingeben (m:ss.mmm, z. B. 1:23.456 oder 58.120). Eingetragen wird unter deinem Namen.'
    : 'Zum Eintragen bitte einloggen. Dein Konto bekommst du vom Admin.';
}

async function sb(path, opts = {}, retried = false) {
  if (session && session.expires_at - 30 < Date.now() / 1000) { try { await refreshSession(); } catch {} }
  const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=representation', ...(opts.headers || {}) };
  if (session) headers.Authorization = 'Bearer ' + session.access_token;
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { ...opts, headers });
  if (res.status === 401 && session && !retried) {
    try { await refreshSession(); return sb(path, opts, true); } catch {}
  }
  if (!res.ok) {
    let j = {};
    try { j = await res.json(); } catch {}
    const e = new Error(j.message || 'Fehler');
    e.code = j.code;
    throw e;
  }
  return res.status === 204 ? null : res.json();
}

const TOP_N = 5;
const PAGE = 1000;
const MAX_MS = 24 * 3600 * 1000;
let data = { maps: [], scores: [] };
let loaded = false;
const expanded = new Set();
const flash = new Map();

async function fetchAll(query) {
  const out = [];
  for (let from = 0; ; from += PAGE) {
    const page = await sb(`${query}&limit=${PAGE}&offset=${from}`);
    out.push(...page);
    if (page.length < PAGE) return out;
  }
}


function fmt(ms) {
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return `${m}:${String(s).padStart(2, '0')}.${String(r).padStart(3, '0')}`;
}
function parseTime(str) {
  str = str.trim().replace(',', '.');
  const m = str.match(/^(?:(\d+):)?(\d+)(?:\.(\d{1,3}))?$/);
  if (!m) return null;
  const sec = parseInt(m[2], 10);
  if (m[1] && sec >= 60) return null;
  const ms = (m[1] ? parseInt(m[1], 10) : 0) * 60000 + sec * 1000 + parseInt((m[3] || '0').padEnd(3, '0'), 10);
  return ms > 0 && ms <= MAX_MS ? ms : null;
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let loading = null;
function load() {
  // Nicht mehrere Ladevorgänge gleichzeitig (z. B. Auto-Refresh + Speichern)
  if (!loading) loading = doLoad().finally(() => { loading = null; });
  return loading;
}
async function doLoad() {
  if (SUPABASE_URL.includes('DEIN-PROJEKT')) {
    $('grid').innerHTML = '<div class="empty">Bitte zuerst SUPABASE_URL und SUPABASE_KEY oben in der index.html eintragen.</div>';
    return;
  }
  try {
    const [maps, scores] = await Promise.all([
      fetchAll('maps?select=id,name&order=sort,id'),
      fetchAll('scores?select=id,map_id,user_id,name,ms,created_at&order=ms,id'),
    ]);
    data = {
      maps,
      scores: scores.map((s) => ({ id: s.id, mapId: s.map_id, userId: s.user_id, name: s.name, ms: s.ms, date: s.created_at })),
    };
    loaded = true;
    render();
  } catch (e) {
    if (!loaded) $('grid').innerHTML = '<div class="empty">Verbindung zur Datenbank fehlgeschlagen. Sind SUPABASE_URL und SUPABASE_KEY oben in der index.html richtig eingetragen?</div>';
    else console.warn('Aktualisieren fehlgeschlagen', e);
  }
}

// Jede Map bekommt ein eigenes Farbthema, Icon und Muster
const THEMES = [
  { re: /summer|sommer/i, boss: 'Master of Summer', c1: '#4cc35a', c2: '#f5d442', ico: '☀️',
    pat: 'radial-gradient(circle at 92% 30%, rgba(255,225,90,.45) 0 22px, transparent 23px)' },
  { re: /winter/i, boss: 'Master of Winter', c1: '#58b8ff', c2: '#bfe9ff', ico: '❄️',
    pat: 'radial-gradient(rgba(255,255,255,.4) 1.5px, transparent 2px) 0 0/16px 16px' },
  { re: /desert|wüste|wueste/i, boss: 'Master of Desert', c1: '#e8893a', c2: '#f3c874', ico: '🏜️',
    pat: 'repeating-linear-gradient(160deg, rgba(255,200,120,.14) 0 10px, transparent 10px 22px)' },
];
const EXTRA_ICONS = ['🏁', '🚗', '🏎️', '⚡', '🔥', '🌋', '🌲', '🌃', '🚀', '🌊'];
const EXTRA_PATTERNS = [
  'repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 8px, transparent 8px 16px)',
  'radial-gradient(rgba(255,255,255,.18) 2px, transparent 2.5px) 0 0/14px 14px',
  'repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 14px)',
  'linear-gradient(135deg, transparent 60%, rgba(255,255,255,.1) 60% 70%, transparent 70%)',
];
function themeFor(name) {
  const t = THEMES.find((x) => x.re.test(name));
  if (t) {
    // Innerhalb einer Welt leicht variieren, damit z. B. Summer 1–5 nicht identisch sind
    const n = parseInt((name.match(/\d+/) || [0])[0], 10) || 0;
    const shift = ((n % 5) - 2) * 6;
    return { ...t, c1: shiftHue(t.c1, shift), c2: t.c2 };
  }
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = h % 360;
  return {
    c1: `hsl(${hue} 70% 58%)`, c2: `hsl(${(hue + 40) % 360} 80% 68%)`,
    ico: EXTRA_ICONS[h % EXTRA_ICONS.length], pat: EXTRA_PATTERNS[h % EXTRA_PATTERNS.length],
  };
}
function shiftHue(hex, deg) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return `hsl(${Math.round((h + deg + 360) % 360)} ${Math.round(s * 100)}% ${Math.round(l * 100)}%)`;
}

const personKey = (name) => name.toLowerCase();

function rowsFor(mapId, bestOnly = $('bestOnly').checked) {
  let rows = data.scores.filter((s) => s.mapId === mapId).sort((a, b) => a.ms - b.ms || a.date.localeCompare(b.date));
  if (bestOnly) {
    const seen = new Set();
    rows = rows.filter((s) => { const k = personKey(s.name); if (seen.has(k)) return false; seen.add(k); return true; });
  }
  return rows;
}

// Gleicher Wert = gleicher Rang (1, 2, 2, 4 …)
function ranksOf(list, same) {
  let rank = 0;
  return list.map((x, i) => (rank = i > 0 && same(x, list[i - 1]) ? rank : i + 1));
}

// ---------- Gesamtwertung ----------
// Pro Map zählt die Bestzeit jeder Person: 1. Platz 7 Punkte, 2. Platz 6 … ab dem 7. Platz 1 Punkt, nicht gespielt 0.
const MAX_POINTS = 7;
const pointsFor = (rank) => Math.max(1, MAX_POINTS + 1 - rank);

function overallStandings() {
  const tot = new Map();
  for (const m of data.maps) {
    const rows = rowsFor(m.id, true);
    const ranks = ranksOf(rows, (a, b) => a.ms === b.ms);
    rows.forEach((s, i) => {
      const k = personKey(s.name);
      const t = tot.get(k) || { name: s.name, userIds: new Set(), pts: 0, wins: 0, played: 0 };
      t.pts += pointsFor(ranks[i]);
      t.played++;
      if (ranks[i] === 1) t.wins++;
      if (s.userId) t.userIds.add(s.userId);
      tot.set(k, t);
    });
  }
  return [...tot.values()].sort((a, b) => b.pts - a.pts || b.wins - a.wins || a.name.localeCompare(b.name));
}

function renderOverall() {
  const list = overallStandings();
  const ranks = ranksOf(list, (a, b) => a.pts === b.pts);
  const maps = data.maps.length;
  const body = list.length
    ? `<table>${list.map((t, i) => {
        const mine = session && (t.userIds.has(session.user_id) || personKey(t.name) === personKey(session.username));
        const cls = [ranks[i] <= 3 ? 'r' + ranks[i] : '', mine ? 'me' : ''].join(' ').trim();
        return `<tr class="${cls}">
          <td class="rank">${ranks[i]}</td>
          <td class="name" title="${esc(t.name)}">${esc(t.name)}</td>
          <td class="maps" title="Maps gespielt / Map-Siege">${t.played}/${maps}${t.wins ? ` · ${t.wins}🥇` : ''}</td>
          <td class="pts">${t.pts}</td>
        </tr>`;
      }).join('')}</table>`
    : '<div class="empty">Noch keine Zeiten 🏁</div>';
  $('overall').innerHTML = `
    <div class="banner"><h2><span class="ico">🏆</span>Gesamtwertung</h2><small>Punkte</small></div>
    <div class="body">${body}
      <div class="login-note">Pro Map: 1. Platz ${MAX_POINTS} Pkt, 2. Platz ${MAX_POINTS - 1} … ab ${MAX_POINTS}. Platz 1 Pkt, nicht gespielt 0. Gezählt wird die Bestzeit pro Person.</div>
    </div>`;
}

// ---------- Boss-Ranglisten (Summer / Winter / Desert) ----------
// Summe der Bestzeiten über alle Maps einer Welt; wer nicht alle gespielt hat: NEF
function bossStandings(worldMaps) {
  const tot = new Map();
  for (const m of worldMaps) {
    for (const s of rowsFor(m.id, true)) {
      const k = personKey(s.name);
      const t = tot.get(k) || { name: s.name, userIds: new Set(), sum: 0, played: 0 };
      t.sum += s.ms;
      t.played++;
      if (s.userId) t.userIds.add(s.userId);
      tot.set(k, t);
    }
  }
  const all = [...tot.values()].map((t) => ({ ...t, done: t.played === worldMaps.length }));
  const done = all.filter((t) => t.done).sort((a, b) => a.sum - b.sum || a.name.localeCompare(b.name));
  const nef = all.filter((t) => !t.done).sort((a, b) => b.played - a.played || a.name.localeCompare(b.name));
  return { done, nef };
}

function renderBosses() {
  $('bosses').innerHTML = THEMES.map((th) => {
    const worldMaps = data.maps.filter((m) => th.re.test(m.name));
    if (!worldMaps.length) return '';
    const { done, nef } = bossStandings(worldMaps);
    const ranks = ranksOf(done, (a, b) => a.sum === b.sum);
    const best = done[0]?.sum;
    const isMe = (t) => session && (t.userIds.has(session.user_id) || personKey(t.name) === personKey(session.username));
    const rows = [
      ...done.map((t, i) => {
        const cls = [ranks[i] <= 3 ? 'r' + ranks[i] : '', isMe(t) ? 'me' : ''].join(' ').trim();
        return `<tr class="${cls}">
          <td class="rank">${ranks[i]}</td>
          <td class="name" title="${esc(t.name)}">${esc(t.name)}</td>
          <td class="time">${fmt(t.sum)}</td>
          <td class="diff">${t.sum === best ? '' : '+' + ((t.sum - best) / 1000).toFixed(3)}</td>
        </tr>`;
      }),
      ...nef.map((t) => `<tr class="${isMe(t) ? 'me' : ''}">
          <td class="rank">–</td>
          <td class="name" title="${esc(t.name)}">${esc(t.name)}</td>
          <td class="time nef" title="Noch nicht alle Maps gespielt">NEF</td>
          <td class="diff">${t.played}/${worldMaps.length}</td>
        </tr>`),
    ];
    const body = rows.length ? `<table>${rows.join('')}</table>` : '<div class="empty">Noch keine Zeiten 🏁</div>';
    return `<section class="card" style="--c1:${th.c1};--c2:${th.c2};--pat:${th.pat}">
      <div class="banner"><h2><span class="ico">${th.ico}</span>${th.boss}</h2><small>${worldMaps.length} Maps</small></div>
      <div class="body">${body}</div>
    </section>`;
  }).join('');
}

function render() {
  renderOverall();
  renderBosses();
  $('grid').innerHTML = data.maps.map((m) => {
    const rows = rowsFor(m.id);
    const open = expanded.has(m.id);
    const shown = open ? rows : rows.slice(0, TOP_N);
    const best = rows[0]?.ms;
    const ranks = ranksOf(rows, (a, b) => a.ms === b.ms);
    const table = rows.length
      ? `<table>${shown.map((s, i) => {
          const mine = session && s.userId === session.user_id;
          const cls = [ranks[i] <= 3 ? 'r' + ranks[i] : '', mine ? 'me' : ''].join(' ').trim();
          return `
          <tr class="${cls}">
            <td class="rank">${ranks[i]}</td>
            <td class="name" title="${esc(s.name)}">${esc(s.name)}</td>
            <td class="time" title="${esc(new Date(s.date).toLocaleString('de-CH'))}">${fmt(s.ms)}</td>
            <td class="diff">${s.ms === best ? '' : '+' + ((s.ms - best) / 1000).toFixed(3)}</td>
            <td class="act">${mine ? `<button class="del" title="Löschen" data-id="${s.id}">✕</button>` : ''}</td>
          </tr>`;
        }).join('')}</table>`
      : '<div class="empty">Noch keine Zeiten 🏁</div>';
    const f = flash.get(m.id);
    const msg = f && f.until > Date.now() ? f : null;
    const more = rows.length > TOP_N
      ? `<button class="more" data-id="${m.id}">${open ? 'Weniger anzeigen' : `Alle ${rows.length} anzeigen`}</button>` : '';
    const t = themeFor(m.name);
    return `<section class="card" data-map="${m.id}" style="--c1:${t.c1};--c2:${t.c2};--pat:${t.pat}">
      <div class="banner"><h2><span class="ico">${t.ico}</span>${esc(m.name)}</h2><small>${rows.length} ${rows.length === 1 ? 'Zeit' : 'Zeiten'}</small></div>
      <div class="body">
      ${table}${more}
      ${session ? `<form class="quick" data-id="${m.id}" autocomplete="off">
        <input class="t" placeholder="Zeit z. B. 1:23.456" required maxlength="15" inputmode="decimal">
        <button class="primary" type="submit">OK</button>
      </form>` : '<div class="login-note">Zum Eintragen bitte einloggen</div>'}
      <div class="err${msg && msg.ok ? ' ok' : ''}">${msg ? esc(msg.text) : ''}</div>
      </div>
    </section>`;
  }).join('');

  document.querySelectorAll('.more').forEach((b) => b.onclick = () => {
    expanded.has(b.dataset.id) ? expanded.delete(b.dataset.id) : expanded.add(b.dataset.id);
    render();
  });
  document.querySelectorAll('.del').forEach((b) => b.onclick = async () => {
    if (!confirm('Diese Zeit wirklich löschen?')) return;
    b.disabled = true;
    try {
      const del = await sb('scores?id=eq.' + b.dataset.id, { method: 'DELETE' });
      // RLS blockiert still: dann kommt eine leere Liste zurück
      if (Array.isArray(del) && !del.length) alert('Zeit konnte nicht gelöscht werden (bitte neu einloggen).');
    } catch (e) { alert('Fehler beim Löschen'); }
    load();
  });
  document.querySelectorAll('form.quick').forEach((f) => f.onsubmit = async (e) => {
    e.preventDefault();
    const mapId = f.dataset.id;
    const err = f.parentElement.querySelector('.err');
    const btn = f.querySelector('button');
    err.textContent = '';
    err.classList.remove('ok');
    const ms = parseTime(f.querySelector('.t').value);
    if (!ms) { err.textContent = 'Ungültige Zeit – z. B. 1:23.456 (max. 24 h)'; return; }
    if (btn.disabled) return;
    btn.disabled = true;
    const mine = data.scores.filter((s) => s.mapId === mapId && s.userId === session?.user_id);
    const prevBest = mine.length ? Math.min(...mine.map((s) => s.ms)) : null;
    try {
    await sb('scores', { method: 'POST', body: JSON.stringify({ map_id: mapId, ms }) });
    } catch (e) {
      btn.disabled = false;
      err.textContent = !session ? 'Bitte neu einloggen' : 'Fehler beim Speichern – bitte nochmal versuchen';
      return;
    }
    const text = prevBest === null ? `Gespeichert: ${fmt(ms)} 🏁`
      : ms < prevBest ? `Neue Bestzeit! 🎉 ${((prevBest - ms) / 1000).toFixed(3)} s schneller`
      : `Gespeichert – deine Bestzeit bleibt ${fmt(prevBest)}`;
    flash.set(mapId, { text, ok: true, until: Date.now() + 8000 });
    load();
  });
}

$('addMapForm').onsubmit = async (e) => {
  e.preventDefault();
  const name = $('newMap').value.trim();
  if (!name) return;
  try {
    await sb('maps', { method: 'POST', body: JSON.stringify({ name }) });
  } catch (e) { alert(e.code === '23505' ? 'Map existiert schon' : 'Fehler beim Anlegen'); return; }
  $('newMap').value = '';
  load();
};

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('authErr').textContent = '';
  const u = $('userInput').value, p = $('passInput').value;
  if (!u.trim() || !p) return;
  const btn = $('loginForm').querySelector('button');
  btn.disabled = true;
  try {
    saveSession(await authCall('password', { email: usernameToEmail(u), password: p }));
    $('passInput').value = '';
    load();
  } catch (err) {
    $('authErr').textContent = err.message === 'auth' ? 'Benutzername oder Passwort falsch' : 'Keine Verbindung zum Server';
  } finally { btn.disabled = false; }
};
$('logoutBtn').onclick = () => {
  // Refresh-Token auch bei Supabase ungültig machen (Fehler egal)
  if (session) fetch(SUPABASE_URL + '/auth/v1/logout', {
    method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + session.access_token },
  }).catch(() => {});
  saveSession(null);
  load();
};

$('bestOnly').onchange = render;
renderAuth();
load();
// Auto-Refresh, aber nicht während jemand gerade eine Zeit tippt oder der Tab im Hintergrund ist
const isTyping = () => [...document.querySelectorAll('form.quick .t')].some((i) => i.value || i === document.activeElement);
setInterval(() => { if (!document.hidden && !isTyping()) load(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isTyping()) load(); });
</script>
</body>
</html>
